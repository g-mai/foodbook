name: Auto-merge recipes

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge eligible recipes at their validated commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { default: autoMergeRecipes } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/auto-merge-recipes.mjs`
            );
            await autoMergeRecipes({ github, context, core });
